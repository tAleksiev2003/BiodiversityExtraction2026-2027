# Pipeline B with at most 4 chunks per paper. Since 2026-11-19 this is the default
# (settings.yaml), so this file changes nothing; it is kept so the commands and run names
# of 2026-11-19 still work. With the old prompts: add config/experiments/prompt_v2.yaml's paths.
# Longer papers get larger chunks (up to chunked_part_tokens); one-chunk papers come from F's cache.
chunking:
  max_chunks_per_document: 4
