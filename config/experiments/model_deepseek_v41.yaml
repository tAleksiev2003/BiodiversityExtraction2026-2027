# Pipeline F with DeepSeek 4.1 and prompt v4 (2026-11-19: C1 0.6644, C2b 0.3733).
# Equals the default except for the level prompt (default since 2026-11-19, switched off below);
# kept so the commands and run names of 2026-11-19 still work. The service rule (default since
# 2026-11-19) applies: C2b 0.4130; without it: no_service_rule.yaml. Context assumed 1M like 4.0.
models:
  full_text: deepseek-v4.1-flash-1017
paths:
  prompt_extraction: config/prompts/extraction_v4.txt

# Made before the level prompt became the default (2026-11-19): without it, as when it was run.
field_prompts:
  biodiversity_level: null

# Made before the ecosystem_type rule became the default (2026-11-19): without it, as when it was run.
postprocess:
  drop_ecosystem_type_for_land_only_habitats: false
