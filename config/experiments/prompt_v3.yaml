# Prompt v3 (F) and chunk prompt v2 (B), tried on 2026-11-19 and worse than v2 (config/prompts/README.md),
# with the model of that run (DeepSeek 4.0, also for B). Their answers are in the cache, so a run costs 0 requests.
paths:
  prompt_extraction: config/prompts/extraction_v3.txt
  prompt_extraction_chunked: config/prompts/extraction_chunk_v2.txt
models:
  full_text: deepseek-v4-flash-0731
  chunked: deepseek-v4-flash-0731

# Made before the level prompt became the default (2026-11-19): without it, as when it was run.
field_prompts:
  biodiversity_level: null

# Made before the ecosystem_type rule became the default (2026-11-19): without it, as when it was run.
postprocess:
  drop_ecosystem_type_for_land_only_habitats: false
