[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anlp-taskc"
version = "0.1.0"
description = "Evidence-grounded sequential and parallel biodiversity extraction"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
eval = ["bert-score>=0.3.13,<0.4", "scipy>=1.11"]

[project.scripts]
anlp-taskc = "anlp_taskc.cli:main"

[tool.setuptools.packages.find]
include = ["anlp_taskc*"]

[tool.setuptools.package-data]
anlp_taskc = ["schemas/*.json"]
